function toast(t,u){const o=document.querySelector('.toast');if(o)o.remove();const e=document.createElement('div');e.className='toast';const m=document.createElement('span');m.className='toast-m';m.textContent=t;e.appendChild(m);if(u){const b=document.createElement('button');b.className='toast-u';b.textContent='Undo';b.onclick=()=>{sfx('undo');u();e.remove()};e.appendChild(b)}document.body.appendChild(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),260)},u?5e3:3200)}
const xser=ts=>{const d=new Date(ts);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds())/864e5+25569};
function buildWorkbook(){
 const X=XLSX,wb=X.utils.book_new(),DT='dd-mmm-yyyy hh:mm',NM='#,##0.00;[Red]-#,##0.00';
 const cn=id=>id?cat(id).name:'',an=id=>(acc(id)||{}).name||'',TY={bank:'Bank',cash:'Cash',credit:'Credit'};
 const used=new Set();
 const sname=n=>{let b=String(n).replace(/[\\\/?*\[\]:]/g,' ').trim().slice(0,31)||'Sheet',r=b,i=2;while(used.has(r.toLowerCase())){const x=' ('+i++ +')';r=b.slice(0,31-x.length)+x}used.add(r.toLowerCase());return r};
 const sheetOf=(head,rows,widths,fmt)=>{const ws=X.utils.aoa_to_sheet([head,...rows]);ws['!cols']=widths.map(w=>({wch:w}));
  const r=X.utils.decode_range(ws['!ref']);for(let R=1;R<=r.e.r;R++)for(const[C,z]of Object.entries(fmt)){const c=ws[X.utils.encode_cell({r:R,c:+C})];if(c&&c.t==='n')c.z=z}
  ws['!autofilter']={ref:ws['!ref']};return ws};
 const all=[...S.tx].sort((a,b)=>a.ts-b.ts);
 /* Accounts overview */
 const rows=S.acc.map(a=>{const l=all.filter(t=>t.acc===a.id||t.to===a.id);
  let inn=0,out=0;l.forEach(t=>{if(t.type==='transfer'){if(t.to===a.id)inn+=t.amt;if(t.acc===a.id)out+=t.amt}else if(t.acc===a.id){t.type==='income'?inn+=t.amt:out+=t.amt}});
  return[a.name,TY[a.type]||a.type,+a.open||0,+inn.toFixed(2),+out.toFixed(2),+bal(a).toFixed(2),l.length]});
 const sa=a=>S.acc.filter(a2=>a2.type!=='credit'===a).map(bal).reduce((s,v)=>s+v,0);
 const n=rows.length+1;
 const ws1=sheetOf(['Account','Type','Opening balance / Credit limit','Total in','Total out','Current balance / Available credit','Transactions'],rows,[26,10,30,16,16,34,14],{2:NM,3:NM,4:NM,5:NM});
 delete ws1['!autofilter'];
 X.utils.sheet_add_aoa(ws1,[[],['Available balance (bank + cash)','','','','',+sa(true).toFixed(2)],['Available credit','','','','',+sa(false).toFixed(2)]],{origin:n});
 [n+1,n+2].forEach(R=>{const c=ws1[X.utils.encode_cell({r:R,c:5})];if(c)c.z=NM});
 X.utils.book_append_sheet(wb,ws1,sname('Accounts'));
 /* All transactions */
 const tr=all.map(t=>[{t:'n',v:xser(t.ts),z:DT},cap(t.type),t.type==='transfer'?'':cn(t.cat),an(t.acc),t.type==='transfer'?an(t.to):'',+(+t.amt).toFixed(2),t.title||'',(t.tags||[]).join(', ')]);
 X.utils.book_append_sheet(wb,sheetOf(['Date & time','Type','Category','Account','To account','Amount','Note','Tags'],tr,[18,11,22,22,22,14,34,22],{5:NM}),sname('Transactions'));
 /* One ledger per account, with running balance */
 S.acc.forEach(a=>{let b=+a.open||0;const lr=[['','Opening balance','','','',b,'']];
  all.forEach(t=>{let i=0,o=0,what='';
   if(t.type==='transfer'){if(t.acc===a.id){o=t.amt;what='Transfer to '+an(t.to)}if(t.to===a.id){i=t.amt;what='Transfer from '+an(t.acc)}if(!o&&!i)return}
   else if(t.acc===a.id){t.type==='income'?i=t.amt:o=t.amt;what=cn(t.cat)}else return;
   b+=i-o;lr.push([{t:'n',v:xser(t.ts),z:DT},what,t.title||'',i?+i.toFixed(2):'',o?+o.toFixed(2):'',+b.toFixed(2),(t.tags||[]).join(', ')])});
  X.utils.book_append_sheet(wb,sheetOf(['Date & time','Category / Transfer','Note','Money in','Money out','Balance','Tags'],lr,[18,26,34,14,14,16,22],{3:NM,4:NM,5:NM}),sname(a.name))});
 return wb}
async function saveXlsx(name,b64,mime){
 const C=window.Capacitor;
 if(C&&C.isNativePlatform&&C.isNativePlatform()){
  const{Filesystem,Share}=C.Plugins;
  const r=await Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
  try{await Share.share({title:name,dialogTitle:'Save or send your Excel file',url:r.uri})}catch(e){if(!/cancel/i.test(String(e&&e.message||e)))throw e}
  return}
 const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:mime||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e3);toast('File downloaded')}
async function exportXlsx(){
 try{await loadXl();if(!window.XLSX)throw new Error('Excel library did not load');

  await saveXlsx(name,XLSX.write(buildWorkbook(),{bookType:'xlsx',type:'base64'}))}
 catch(e){sheet(`${head('Export failed')}<p class="mu">Could not create the Excel file.</p><p class="err">${esc(e&&e.message||e)}</p>`)}}
